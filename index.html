<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bette King Productions</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #111008;
      min-height: 100vh;
      padding: 30px 20px 60px;
    }

    .page {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    /* Flyers */
    .flyer img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Videos */
    .video-wrap {
      background: #000;
      width: 100%;
    }
    .video-wrap iframe {
      display: block;
      width: 100%;
      aspect-ratio: 16/9;
      border: none;
    }

    /* Chris Montez */
    .chris-photo img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Audio player */
    .audio-wrap {
      background: #1a1608;
      padding: 20px;
      border: 1px solid rgba(201,168,76,0.2);
    }
    .audio-wrap audio {
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="page">

    <!-- Flyer 1 -->
    <div class="flyer">
      <img src="https://ui162.github.io/bkp/flyer1.png" alt="Flyer 1" />
    </div>

    <!-- Flyer 2 -->
    <div class="flyer">
      <img src="https://ui162.github.io/bkp/flyer2.png" alt="Flyer 2" />
    </div>

    <!-- Flyer 3 -->
    <div class="flyer">
      <img src="https://ui162.github.io/bkp/flyer3.png" alt="Flyer 3" />
    </div>

    <!-- Coasters -->
    <div class="video-wrap">
      <iframe src="https://www.youtube-nocookie.com/embed/x-_553eZGk8"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen loading="lazy"></iframe>
    </div>

    <!-- Quadrasoul -->
    <div class="video-wrap">
      <iframe src="https://www.youtube-nocookie.com/embed/f0P3Kovn8Uk"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen loading="lazy"></iframe>
    </div>

    <!-- Flyer 4 -->
    <div class="flyer">
      <img src="https://ui162.github.io/bkp/flyer4.png" alt="Flyer 4" />
    </div>

    <!-- Flyer 5 -->
    <div class="flyer">
      <img src="https://ui162.github.io/bkp/flyer5.png" alt="Flyer 5" />
    </div>

    <!-- Chris Montez Photo + Audio -->
    <div class="chris-photo">
      <img src="https://ui162.github.io/bkp/chrismontezlivephoto.png" alt="Chris Montez Live" />
    </div>

    <div class="audio-wrap">
      <audio controls>
        <source src="https://ui162.github.io/bkp/chrismontezlive.mp3" type="audio/mpeg" />
        Your browser does not support the audio element.
      </audio>
    </div>

    <!-- Chris Montez Video -->
    <div class="video-wrap">
      <iframe src="https://www.youtube-nocookie.com/embed/Vw9qhDdVGwY?start=1"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen loading="lazy"></iframe>
    </div>

  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Bette King Productions</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background-color: #111008;
  min-height: 100vh;
  padding: 30px 20px 60px;
}
.page {
  max-width: 720px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 30px;
}
.flyer img {
  width: 100%;
  height: auto;
  display: block;
}
.yt-link {
  display: block;
  position: relative;
  width: 100%;
  aspect-ratio: 16/9;
  background: #000;
  overflow: hidden;
  text-decoration: none;
}
.yt-link img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: opacity 0.2s;
}
.yt-link:hover img {
  opacity: 0.75;
}
.yt-play {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 80px;
  height: 80px;
  background: rgba(255, 0, 0, 0.92);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 24px rgba(0,0,0,0.7);
  transition: transform 0.2s, background 0.2s;
}
.yt-link:hover .yt-play {
  background: rgb(255, 0, 0);
  transform: translate(-50%, -50%) scale(1.12);
}
.yt-play svg {
  width: 32px;
  height: 32px;
  fill: white;
  margin-left: 6px;
}
.yt-label {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 10px 14px;
  background: linear-gradient(transparent, rgba(0,0,0,0.75));
  color: #fff;
  font-family: sans-serif;
  font-size: 14px;
  letter-spacing: 0.03em;
}
.chris-photo img {
  width: 100%;
  height: auto;
  display: block;
}
.audio-wrap {
  background: #1a1608;
  padding: 20px;
  border: 1px solid rgba(201,168,76,0.5);
  border-radius: 8px;
  text-align: center;
}
.audio-label {
  color: #ffffff !important;
  font-family: sans-serif;
  font-size: 16px;
  font-weight: bold;
  letter-spacing: 0.04em;
  margin-bottom: 12px;
  text-transform: uppercase;
  background: #c00000;
  padding: 8px 12px;
  border-radius: 4px;
  display: block;
}
.audio-wrap audio {
  width: 100%;
}
</style>
</head>
<body>
<div class="page">
 
  <!-- Flyer 1 -->
  <div class="flyer">
    <img src="https://ui162.github.io/bkp/flyer1.png" alt="Flyer 1" />
  </div>
 
  <!-- Flyer 2 -->
  <div class="flyer">
    <img src="https://ui162.github.io/bkp/flyer2.png" alt="Flyer 2" />
  </div>
 
  <!-- Flyer 3 -->
  <div class="flyer">
    <img src="https://ui162.github.io/bkp/flyer3.png" alt="Flyer 3" />
  </div>
 
  <!-- Coasters Sizzle Photo -->
  <div class="flyer">
    <img src="https://ui162.github.io/bkp/Coasterssizzle.png" alt="Coasters" />
  </div>
 
  <!-- Coasters Video -->
  <a class="yt-link" href="https://www.youtube.com/watch?v=x-_553eZGk8" target="_blank" rel="noopener">
    <img src="https://img.youtube.com/vi/x-_553eZGk8/maxresdefault.jpg" alt="Coasters Sizzle Reel" />
    <div class="yt-play"><svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg></div>
    <div class="yt-label">▶ Watch on YouTube — Coasters</div>
  </a>
 
  <!-- Quadrasoul Video -->
  <a class="yt-link" href="https://www.youtube.com/watch?v=f0P3Kovn8Uk" target="_blank" rel="noopener">
    <img src="https://img.youtube.com/vi/f0P3Kovn8Uk/hqdefault.jpg" alt="Quadrasoul" onerror="this.src='https://img.youtube.com/vi/f0P3Kovn8Uk/mqdefault.jpg'" />
    <div class="yt-play"><svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg></div>
    <div class="yt-label">▶ Watch on YouTube — Quadrasoul</div>
  </a>
 
  <!-- Flyer 4 -->
  <div class="flyer">
    <img src="https://ui162.github.io/bkp/flyer4.png" alt="Flyer 4" />
  </div>
 
  <!-- Flyer 5 -->
  <div class="flyer">
    <img src="https://ui162.github.io/bkp/flyer5.png" alt="Flyer 5" />
  </div>
 
  <!-- Brian Hyland Video -->
  <a class="yt-link" href="https://www.youtube.com/watch?v=oyiMVY33gOM" target="_blank" rel="noopener">

    <div class="yt-play"><svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg></div>
    <div class="yt-label">▶ Watch on YouTube — Chris Montez</div>
  </a>
 
</div>
</body>
</html>
